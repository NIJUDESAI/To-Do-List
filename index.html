<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do List</title>
    <meta name="description" content="A feature-rich, modern To-Do List web application with local storage, priority levels, progress tracking, and dark mode.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Confetti canvas for task completion celebrations -->
    <canvas id="confettiCanvas"></canvas>

    <div class="todo-app-wrapper">
        <!-- Main Card Container -->
        <main class="todo-container" id="mainContainer">
            
            <!-- App Header -->
            <header class="app-header">
                <div class="header-left">
                    <div class="app-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                            <circle cx="12" cy="12" r="4"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="app-title">TaskFlow</h1>
                        <p class="current-date" id="currentDate">Loading date...</p>
                    </div>
                </div>

                <!-- Theme Toggle Button -->
                <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle dark mode" title="Toggle dark/light theme">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </header>

            <!-- Progress Tracker Card -->
            <section class="progress-card" aria-label="Task completion progress">
                <div class="progress-info">
                    <span class="progress-title">Your Progress</span>
                    <span class="progress-count" id="progressCount">0 / 0 Completed</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
                </div>
                <div class="progress-percentage-label" id="progressPercent">0%</div>
            </section>

            <!-- Task Input Section -->
            <form class="input-section" id="taskForm" onsubmit="return false;">
                <div class="input-row">
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                        <input 
                            type="text" 
                            id="taskInput" 
                            placeholder="What do you need to accomplish today?" 
                            autocomplete="off"
                            maxlength="120"
                            required
                        >
                    </div>

                    <!-- Priority Selection -->
                    <div class="priority-selector">
                        <select id="prioritySelect" aria-label="Task Priority">
                            <option value="medium" selected>Normal</option>
                            <option value="high">High</option>
                            <option value="low">Low</option>
                        </select>
                    </div>

                    <!-- Add Button -->
                    <button type="submit" id="addButton" class="add-button" title="Add Task">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add</span>
                    </button>
                </div>
            </form>

            <!-- Filter Tabs & Search Controls -->
            <div class="controls-section">
                <!-- Search bar -->
                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search tasks...">
                </div>

                <!-- Filter Pills -->
                <div class="filter-tabs" role="tablist">
                    <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">
                        All <span class="badge" id="badgeAll">0</span>
                    </button>
                    <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">
                        Pending <span class="badge" id="badgeActive">0</span>
                    </button>
                    <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">
                        Completed <span class="badge" id="badgeCompleted">0</span>
                    </button>
                </div>
            </div>

            <!-- Task List -->
            <ul id="taskList" class="task-list" aria-label="To-do items list">
                <!-- Tasks will be dynamically injected here -->
            </ul>

            <!-- Empty State Graphic -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon-wrap">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        <path d="m9 14 2 2 4-4"></path>
                    </svg>
                </div>
                <h3 class="empty-title">All tasks completed!</h3>
                <p class="empty-desc">Add a new task above to stay productive and organized.</p>
            </div>

            <!-- App Footer -->
            <footer class="app-footer">
                <span class="tasks-left" id="tasksLeft">0 pending tasks</span>
                <button class="clear-completed-btn" id="clearCompletedBtn" title="Remove all completed tasks">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    Clear Completed
                </button>
            </footer>

        </main>
    </div>

    <!-- Script File -->
    <script src="script.js"></script>
</body>

</html>
